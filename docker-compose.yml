# docker compose yml

services:
  app:
    image: laravel/musikitera:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: musikitera-app
    volumes:
      - ./:/var/www
    working_dir: /var/www
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  node:
    image: node:24
    container_name: musikitera-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - VITE_PORT=${VITE_PORT}
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${VITE_PORT}:${VITE_PORT}"


  db:
    image: mysql:8.0
    container_name: musikitera-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: musikitera
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
